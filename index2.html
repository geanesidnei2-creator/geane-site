<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Da Geane Pra Você</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f5f5f5;
      color: #333;
    }

    /* HEADER */
    .header {
      background: linear-gradient(to right, #ff4d88, #ff7eb3);
      color: white;
      text-align: center;
      padding: 40px 20px;
    }

    .header h1 {
      font-size: 32px;
      margin-bottom: 10px;
    }

    .header p {
      font-size: 16px;
      margin-bottom: 15px;
    }

    .btn-whatsapp {
      display: inline-block;
      background: #25d366;
      color: white;
      padding: 12px 20px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: bold;
      transition: 0.3s;
    }

    .btn-whatsapp:hover {
      background: #1ea856;
    }

    /* CARROSSEL */
    .carousel {
      width: 100%;
      max-width: 1100px;
      margin: 20px auto;
      padding: 0 10px;
    }

    .carousel-container {
      position: relative;
      width: 100%;
      height: 220px;
      overflow: hidden;
      border-radius: 15px;
      box-shadow: 0px 3px 8px rgba(0,0,0,0.2);
      touch-action: pan-y;
      cursor: brad;
    }
    .carosel-container:active {
        cursor: grabbing;
    }

    .carousel-slide {
      display: none;
      width: 100%;
      height: 100%;
    }

    .carousel-slide.active {
      display: block;
    }

    .carousel-slide img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* DOTS */
    .dots {
      display: flex;
      justify-content: center;
      margin-top: 10px;
      gap: 8px;
    }

    .dot {
      width: 12px;
      height: 12px;
      background: #ccc;
      border-radius: 50%;
      cursor: pointer;
    }

    .dot.active {
      background: #ff4d88;
    }

    /* CATEGORIAS */
    .categorias {
      padding: 20px;
      text-align: center;
    }

    .categorias h2 {
      margin-bottom: 20px;
      font-size: 24px;
    }

    .grid-categorias {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 12px;
      max-width: 900px;
      margin: auto;
    }

    .card-cat {
      background: white;
      padding: 15px;
      border-radius: 10px;
      font-weight: bold;
      box-shadow: 0px 3px 8px rgba(0,0,0,0.1);
      cursor: pointer;
      transition: 0.2s;
    }

    .card-cat:hover {
      transform: scale(1.03);
    }

    .card-cat.destaque {
      background: #ff4d88;
      color: white;
    }

    /* PRODUTOS */
    .produtos {
      max-width: 1100px;
      margin: 30px auto;
      padding: 0 15px;
      text-align: center;
    }

    .produtos h2 {
      margin-bottom: 20px;
      font-size: 22px;
    }

    .grid-produtos {
      display: grid;
      grid-template-columns: 1fr;
      gap: 20px;
    }

    .card-produto {
      background: white;
      padding: 15px;
      border-radius: 12px;
      box-shadow: 0px 3px 8px rgba(0,0,0,0.1);
      text-align: center;
    }

    .card-produto img {
      width: 100%;
      height: 180px;
      object-fit: cover;
      border-radius: 10px;
      margin-bottom: 10px;
    }

    .card-produto h3 {
      font-size: 18px;
      margin-bottom: 10px;
    }

    .preco {
      font-size: 20px;
      font-weight: bold;
      color: #ff4d88;
      margin-bottom: 15px;
    }

    .btn-comprar {
      display: block;
      width: 100%;
      background: #25d366;
      color: white;
      padding: 10px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: bold;
      transition: 0.3s;
    }

    .btn-comprar:hover {
      background: #1ea856;
    }

    /* FOOTER */
    .footer {
      background: #222;
      color: white;
      text-align: center;
      padding: 20px;
      margin-top: 30px;
      font-size: 13px;
    }

    .footer a {
      display: inline-block;
      margin-top: 10px;
      background: #25d366;
      color: white;
      text-decoration: none;
      padding: 12px 20px;
      border-radius: 10px;
      font-weight: bold;
    }

    /* RESPONSIVO DESKTOP */
    @media (min-width: 768px) {
      .carousel-container {
        height: 400px;
      }

      .grid-produtos {
        grid-template-columns: repeat(3, 1fr);
      }

      .header h1 {
        font-size: 40px;
      }

      .header p {
        font-size: 18px;
      }
    }
  </style>
</head>

<body>

  <!-- HEADER -->
  <header class="header">
    <h1>Da Geane Pra Você</h1>
    <p>Beleza, utilidades e praticidade para o seu dia a dia 💖</p>

    <a class="btn-whatsapp" href="https://wa.me/5599999999999" target="_blank">
      📲 Falar no WhatsApp
    </a>
  </header>

  <!-- CARROSSEL -->
  <section class="carousel">
    <div class="carousel-container">

      <div class="carousel-slide active">
        <img src="https://picsum.photos/id/1080/1200/500" alt="Imagem 1">
      </div>

      <div class="carousel-slide">
        <img src="https://picsum.photos/id/292/1200/500" alt="Imagem 2">
      </div>

      <div class="carousel-slide">
        <img src="https://picsum.photos/id/1081/1200/500" alt="Imagem 3">
      </div>

      <div class="carousel-slide">
        <img src="https://picsum.photos/id/1060/1200/500" alt="Imagem 4">
      </div>

    </div>

    <div class="dots">
      <span class="dot active" onclick="goToSlide(0)"></span>
      <span class="dot" onclick="goToSlide(1)"></span>
      <span class="dot" onclick="goToSlide(2)"></span>
      <span class="dot" onclick="goToSlide(3)"></span>
    </div>
  </section>

  <!-- CATEGORIAS -->
  <section class="categorias">
    <h2>📌 Categorias</h2>

    <div class="grid-categorias">
      <div class="card-cat" onclick="mostrarTodos()">📦 Mostrar Todos</div>
      <div class="card-cat" onclick="filtrarCategoria('Cozinha')">🍳 Cozinha</div>
      <div class="card-cat" onclick="filtrarCategoria('Academia')">🏋️ Academia</div>
      <div class="card-cat" onclick="filtrarCategoria('Avon & Natura')">💄 Avon & Natura</div>
      <div class="card-cat" onclick="filtrarCategoria('Demillus')">👙 Demillus</div>
      <div class="card-cat" onclick="filtrarCategoria('Sala')">🛋️ Sala</div>
      <div class="card-cat" onclick="filtrarCategoria('Banheiro')">🚿 Banheiro</div>
      <div class="card-cat destaque" onclick="filtrarCategoria('Promoções')">⚡ Promoções</div>
    </div>
  </section>

  <!-- PRODUTOS -->
  <section class="produtos">
    <h2 id="titulo-categoria">🔥 Promoções da Semana</h2>
    <div class="grid-produtos" id="produtos"></div>
  </section>

  <!-- FOOTER -->
  <footer class="footer">
    <p>📞 Faça seu pedido pelo WhatsApp</p>
    <a href="https://wa.me/5599999999999" target="_blank">Chamar no WhatsApp</a>
  </footer>

  <script>
    const API_URL = "https://fastapi-geane.onrender.com";
    console.log("Tentando conectar em:", `${API_URL}/produtos`);
  let currentSlide = 0;
  const slides = document.querySelectorAll(".carousel-slide");
  const dots = document.querySelectorAll(".dot");
  const carouselContainer = document.querySelector(".carousel-container");

  function showSlide(index) {
    slides.forEach(slide => slide.classList.remove("active"));
    dots.forEach(dot => dot.classList.remove("active"));

    slides[index].classList.add("active");
    dots[index].classList.add("active");
  }

  function nextSlide() {
    currentSlide++;
    if (currentSlide >= slides.length) currentSlide = 0;
    showSlide(currentSlide);
  }

  function prevSlide() {
    currentSlide--;
    if (currentSlide < 0) currentSlide = slides.length - 1;
    showSlide(currentSlide);
  }

  function goToSlide(index) {
    currentSlide = index;
    showSlide(currentSlide);
  }

  // Auto-play
  let autoplay = setInterval(nextSlide, 4000);

  function resetAutoplay() {
    clearInterval(autoplay);
    autoplay = setInterval(nextSlide, 4000);
  }

  // ==============================
  // SWIPE COM O DEDO (TOUCH)
  // ==============================
  let startX = 0;
  let endX = 0;
  let startY = 0;
  let isSwiping = false;

  carouselContainer.addEventListener("touchstart", (e) => {
    startX = e.touches[0].clientX;
    startY = e.touches[0].clientY;
    isSwiping = true;
  });

  carouselContainer.addEventListener("touchmove", (e) => {
    if (!isSwiping) return;

    let moveX = e.touches[0].clientX;
    let moveY = e.touches[0].clientY;

    let diffX = Math.abs(moveX - startX);
    let diffY = Math.abs(moveY - startY);

    // Se o movimento for mais horizontal do que vertical, evita scroll
    if (diffX > diffY) {
      e.preventDefault();
    }
  }, { passive: false });

  carouselContainer.addEventListener("touchend", (e) => {
    endX = e.changedTouches[0].clientX;
    handleSwipe();
    resetAutoplay();
    isSwiping = false;
  });

  // ==============================
  // SWIPE COM O MOUSE (PC)
  // ==============================
  let mouseDown = false;

  carouselContainer.addEventListener("mousedown", (e) => {
    mouseDown = true;
    startX = e.clientX;
  });

  carouselContainer.addEventListener("mouseup", (e) => {
    if (!mouseDown) return;
    endX = e.clientX;
    handleSwipe();
    resetAutoplay();
    mouseDown = false;
  });

  // ==============================
  // FUNÇÃO DE SWIPE
  // ==============================
  function handleSwipe() {
    const distance = endX - startX;

    if (distance > 50) {
      prevSlide();
    } else if (distance < -50) {
      nextSlide();
    }
  }
     // ==============================
// PRODUTOS (BUSCAR NA API)
// ==============================

const numeroWhatsApp = "5599999999999"; // coloque o número real
let listaProdutos = [];

async function carregarProdutosAPI() {
  try {
    const resposta = await fetch(`${API_URL}/produtos`);
    listaProdutos = await resposta.json();

    console.log("Produtos carregados:", listaProdutos);

    filtrarCategoria("Promoções"); // começa mostrando promoções
  } catch (erro) {
    console.log("Erro ao buscar produtos:", erro);
    document.getElementById("produtos").innerHTML = "<p>❌ Erro ao carregar produtos.</p>";
  }
}

function mostrarProdutos(produtos) {
  const divProdutos = document.getElementById("produtos");
  divProdutos.innerHTML = "";

  if (produtos.length === 0) {
    divProdutos.innerHTML = "<p>⚠️ Nenhum produto encontrado nessa categoria.</p>";
    return;
  }

  produtos.forEach(produto => {
    const mensagem = `Olá Geane! Tenho interesse no produto: ${produto.nome} (R$ ${produto.preco.toFixed(2)})`;
    const linkWhats = `https://wa.me/${numeroWhatsApp}?text=${encodeURIComponent(mensagem)}`;

    divProdutos.innerHTML += `
      <div class="card-produto">
        <img src="${produto.imagem || 'https://picsum.photos/400/300'}" alt="${produto.nome}">
        <h3>${produto.nome}</h3>
        <p class="preco">R$ ${produto.preco.toFixed(2)}</p>
        <a class="btn-comprar" href="${linkWhats}" target="_blank">Comprar no WhatsApp</a>
      </div>
    `;
  });
}

function filtrarCategoria(categoria) {
  document.getElementById("titulo-categoria").innerText = "📌 Categoria: " + categoria;
  const filtrados = listaProdutos.filter(p => p.categoria === categoria);
  mostrarProdutos(filtrados);
}

function mostrarTodos() {
  document.getElementById("titulo-categoria").innerText = "📦 Todos os Produtos";
  mostrarProdutos(listaProdutos);
}

// iniciar carregamento
carregarProdutosAPI();
</script>

</body>
</html>
